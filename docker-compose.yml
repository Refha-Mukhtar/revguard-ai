version: "3.9"

services:
  streamlit-app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file: .env
    depends_on:
      - fastapi-app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  fastapi-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
